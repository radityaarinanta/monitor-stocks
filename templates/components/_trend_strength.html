<!-- 1. TREND STRENGTH METER -->
<div class="enterprise-card mb-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="section-title">
            Indeks Kekuatan Tren
        </span>
        <span class="badge {{ strength_badge_class|default('bg-secondary bg-opacity-10 text-secondary border border-color') }} font-mono px-2 py-1 fs-6">
            {{ strength }}%
        </span>
    </div>
    
    <div class="strength-track my-3">
        <div class="strength-bar-fill {{ strength_bar_class|default('bg-warning') }}" 
             style="width: {{ strength }}%;"></div>
    </div>
    
    <div class="d-flex justify-content-between align-items-center mt-2 font-mono" style="font-size: 0.76rem;">
        <span class="text-theme-muted">Bearish (0%)</span>
        <span class="fw-bold text-primary" style="font-size: 0.82rem;">{{ strength }}% Bullish Power</span>
        <span class="text-theme-muted">Bullish (100%)</span>
    </div>
</div>
