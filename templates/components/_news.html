<!-- 3. FINANCIAL NEWS WIRE -->
<div class="enterprise-card">
    <div class="section-title mb-3">
        Warta Berita Emiten & Pasar
    </div>
    
    {% if news and news|length > 0 %}
        <div>
            {% for n in news %}
            <div class="news-item">
                <a href="{{ n.link }}" target="_blank" rel="noopener noreferrer" class="news-title-link mb-2">
                    {{ n.title }}
                </a>
                <div class="d-flex justify-content-between text-theme-muted font-mono" style="font-size: 0.72rem;">
                    <span>{{ n.pub }}</span>
                    {% if n.time %}<span>{{ n.time }}</span>{% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="text-center py-4 text-theme-muted small font-mono" style="font-size: 0.8rem;">
            Tidak ada siaran berita spesifik untuk emiten ini saat ini.
        </div>
    {% endif %}
</div>
