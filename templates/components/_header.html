<!-- ENTERPRISE TOP NAVBAR -->
<header class="enterprise-header sticky-top mb-4">
    <div class="container-xl d-flex justify-content-between align-items-center">
        <!-- Minimalist Brand Logo & Institutional Subtitle -->
        <a href="/" class="d-flex align-items-center gap-3 text-decoration-none text-reset">
            <div class="brand-icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
            </div>
            <div>
                <div class="d-flex align-items-center" style="line-height: 1.2;">
                    <span class="brand-name">STOCK<span class="text-primary">PULSE</span></span>
                    <span class="brand-tag">PRO</span>
                </div>
                <div class="brand-sub">
                    Decision Support System
                </div>
            </div>
        </a>

        <!-- Right Action Items: Live Market Feed Indicator & Theme Switcher -->
        <div class="d-flex align-items-center gap-3">
            <div class="d-none d-md-flex align-items-center gap-2 px-3 py-1.5 rounded-2 border border-color small font-mono" style="font-size: 0.76rem; background: var(--bg-card);">
                <span class="status-pulse-dot online"></span>
                <span class="text-theme-secondary">IDX / IHSG MARKET FEED</span>
            </div>

            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" type="button" class="btn-theme-toggle" title="Ganti Mode Tampilan (Dark / Light)">
                <i class="bi bi-sun"></i>
                <span class="d-none d-sm-inline">Light Mode</span>
            </button>
        </div>
    </div>
</header>
