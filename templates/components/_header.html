<!-- ENTERPRISE TOP NAVBAR -->
<header class="enterprise-header py-3 sticky-top mb-2">
    <div class="container-xl d-flex justify-content-between align-items-center">
        <!-- Brand Logo & Title -->
        <a href="/" class="d-flex align-items-center gap-2 text-decoration-none text-reset">
            <div class="d-flex align-items-center justify-content-center bg-primary text-white rounded-2 px-2 py-1 fw-bold fs-5">
                <i class="bi bi-graph-up-arrow"></i>
            </div>
            <div>
                <span class="fw-bold fs-5 text-tracking-tight" style="letter-spacing: -0.02em;">
                    STOCK<span class="text-primary">PULSE</span> <span class="badge bg-primary-subtle text-primary border border-primary border-opacity-25 rounded-pill fs-7 fw-bold" style="font-size: 0.68rem; vertical-align: middle;">PRO</span>
                </span>
                <span class="d-none d-md-inline-block text-muted small ms-2 ps-2 border-start border-secondary border-opacity-25" style="font-size: 0.78rem;">
                    Decision Support System
                </span>
            </div>
        </a>

        <!-- Right Action Items: Live Status & Theme Toggle -->
        <div class="d-flex align-items-center gap-3">
            <div class="d-none d-sm-flex align-items-center gap-2 px-2 py-1 rounded-pill bg-success-subtle text-success border border-success border-opacity-25 small" style="font-size: 0.75rem;">
                <i class="bi bi-circle-fill text-success" style="font-size: 0.5rem;"></i>
                <span class="fw-semibold">IHSG Market Data</span>
            </div>

            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" type="button" class="btn-theme-toggle" title="Ganti Mode Tampilan (Dark / Light)">
                <i class="bi bi-sun-fill text-warning"></i>
                <span class="d-none d-sm-inline">Light Mode</span>
            </button>
        </div>
    </div>
</header>
