<!-- ENTERPRISE TOP NAVBAR -->
<header class="enterprise-header py-3 sticky-top mb-3">
    <div class="container-xl d-flex justify-content-between align-items-center">
        <!-- Brand Logo & Institutional Subtitle -->
        <a href="/" class="d-flex align-items-center gap-3 text-decoration-none text-reset">
            <div class="d-flex align-items-center justify-content-center bg-primary text-white rounded-1 px-2 py-1 fw-bold fs-6 font-mono">
                SP
            </div>
            <div>
                <div class="fw-bold fs-5 text-tracking-tight" style="letter-spacing: -0.01em; line-height: 1.2;">
                    STOCK<span class="text-primary">PULSE</span> <span class="badge bg-primary-subtle text-primary border border-primary border-opacity-25 rounded-1 fs-7 fw-bold" style="font-size: 0.65rem; vertical-align: middle;">PRO</span>
                </div>
                <div class="small font-mono text-theme-muted" style="font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase;">
                    Decision Support System
                </div>
            </div>
        </a>

        <!-- Right Action Items: Live Market Feed Indicator & Theme Switcher -->
        <div class="d-flex align-items-center gap-3">
            <div class="d-none d-md-flex align-items-center gap-2 px-3 py-1 rounded-1 bg-card-subtle border border-color small" style="font-size: 0.76rem;">
                <span class="status-pulse-dot online"></span>
                <span class="font-mono text-theme-secondary">IHSG / IDX MARKET DATA</span>
            </div>

            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" type="button" class="btn-theme-toggle" title="Ganti Mode Tampilan (Dark / Light)">
                <i class="bi bi-sun"></i>
                <span class="d-none d-sm-inline">Light Mode</span>
            </button>
        </div>
    </div>
</header>
