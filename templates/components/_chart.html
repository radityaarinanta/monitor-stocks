<!-- INTERACTIVE CANDLESTICK & BOLLINGER BANDS CHART -->
<div class="chart-wrapper my-2">
    {{ plot | safe }}
</div>

<div class="d-flex justify-content-center flex-wrap gap-4 pt-3 border-top border-color small font-mono text-theme-secondary" style="font-size: 0.78rem;">
    <span class="d-flex align-items-center gap-2"><span style="color: var(--success); font-size: 0.85rem;">■</span> Bullish Candle</span>
    <span class="d-flex align-items-center gap-2"><span style="color: var(--danger); font-size: 0.85rem;">■</span> Bearish Candle</span>
    <span class="d-flex align-items-center gap-2"><span style="color: var(--warning); font-weight: bold;">—</span> MA20 Trend</span>
    <span class="d-flex align-items-center gap-2"><span style="color: var(--accent); font-weight: bold;">—</span> MA50 Baseline</span>
    <span class="d-flex align-items-center gap-2"><span style="color: var(--accent);">┄</span> Bollinger Bands (20, 2)</span>
    <span class="d-flex align-items-center gap-2"><span style="color: var(--text-muted);">▍</span> Volume & Vol-MA20</span>
</div>
