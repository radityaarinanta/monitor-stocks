<!-- INTERACTIVE CANDLESTICK & BOLLINGER BANDS CHART -->
<div class="chart-wrapper my-3">
    {{ plot | safe }}
</div>

<div class="d-flex justify-content-center flex-wrap gap-4 pt-2 border-top border-color small text-muted" style="font-size: 0.78rem;">
    <span class="d-flex align-items-center gap-1.5"><span style="color: var(--success);">■</span> Bullish Candle</span>
    <span class="d-flex align-items-center gap-1.5"><span style="color: var(--danger);">■</span> Bearish Candle</span>
    <span class="d-flex align-items-center gap-1.5"><span style="color: var(--warning); font-weight: bold;">—</span> MA20 Trendline</span>
    <span class="d-flex align-items-center gap-1.5"><span style="color: var(--accent);">┄</span> Bollinger Bands (20, 2)</span>
</div>
