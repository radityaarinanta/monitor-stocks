<!-- INTERACTIVE CANDLESTICK & BOLLINGER BANDS CHART -->
<div class="chart-wrapper my-3">
    {{ plot | safe }}
</div>

<div class="d-flex justify-content-center flex-wrap gap-4 pt-3 border-top border-color small font-mono text-theme-secondary" style="font-size: 0.78rem;">
    <span class="d-flex align-items-center gap-2"><span style="color: var(--success); font-size: 0.85rem;">■</span> Candlestick Naik (Bullish)</span>
    <span class="d-flex align-items-center gap-2"><span style="color: var(--danger); font-size: 0.85rem;">■</span> Candlestick Turun (Bearish)</span>
    <span class="d-flex align-items-center gap-2"><span style="color: var(--warning); font-weight: bold;">—</span> MA20 Trendline</span>
    <span class="d-flex align-items-center gap-2"><span style="color: var(--accent);">┄</span> Bollinger Bands (20, 2)</span>
</div>
