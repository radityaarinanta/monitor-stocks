<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StockPulse Pro | Decision Support System{% endblock %}</title>
    
    <!-- Inline Theme Init (Mencegah screen flash) -->
    <script>
        (function() {
            var savedTheme = localStorage.getItem('stockpulse_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- Google Fonts (Inter, Plus Jakarta Sans, JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Enterprise CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Plotly CDN -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Top Enterprise Navbar -->
    {% include 'components/_header.html' %}

    <main class="container-xl py-4">
        <!-- Search & Ticker Bar -->
        {% include 'components/_search_form.html' %}

        <!-- Content Area -->
        {% block content %}{% endblock %}

        <!-- Footer -->
        {% include 'components/_footer.html' %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
